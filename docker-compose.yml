version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: playa-ai-map-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: playa_ai_map
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
